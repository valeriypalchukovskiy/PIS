<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="article">
    <div class="header">
       <img src="https://avatars.mds.yandex.net/i?id=d8d3674255e068f87a9054d869e8326f48b6b445-12432422-images-thumbs&n=13" />
    </div>
    <div class="content">
        <div class="article">
            <h2 class="post-title">{{ post.title }}</h2>
            <div class="article-info">
                <div class="article-author">{{ post.author.username }}</div>
                <div class="article-created-date">{{ post.created_date }}</div>
            </div>
            <p class="article-text">{{ post.text }}</p>
            <div class="back-link">
                <a href="/">← Все записи</a>
            </div>
        </div>
    </div>
</body>
</html>
